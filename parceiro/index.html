<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparador de Preços — Parceiro</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fff7ed; margin: 0; padding: 24px; color: #1f2937; }
    h1 { color: #c2410c; }
    table { border-collapse: collapse; width: 100%; max-width: 700px; background: #fff; }
    td, th { border: 1px solid #fed7aa; padding: 8px; text-align: left; }
    .erro { color: #dc2626; font-weight: 600; }
  </style>
</head>
<body>
  <h1>🔎 BuscaPreço — integração TechLoja</h1>
  <p>Este site parceiro roda em <code>http://localhost:5500</code> e consome a API da loja em <code>http://localhost:3000</code>.</p>
  <div id="resultado">Carregando produtos da TechLoja...</div>

  <script>
    fetch('http://localhost:3000/api/produtos?pagina=1&limite=50')
      .then((r) => r.json())
      .then((dados) => {
        document.getElementById('resultado').innerHTML = `
          <table>
            <tr><th>Produto</th><th>Preço</th></tr>
            ${dados.itens.map((p) => `<tr><td>${p.nome}</td><td>R$ ${p.preco}</td></tr>`).join('')}
          </table>`;
      })
      .catch((erro) => {
        document.getElementById('resultado').innerHTML =
          `<p class="erro">Falha ao buscar produtos: ${erro.message}</p>`;
      });
  </script>
</body>
</html>
