<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechLoja — Produto</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header id="cabecalho"></header>

  <main>
    <section id="detalhe" class="detalhe"></section>

    <section class="avaliacoes">
      <h2>Avaliações dos clientes</h2>
      <ul id="lista-avaliacoes"></ul>

      <form id="form-avaliacao" class="form">
        <h3>Deixe sua avaliação</h3>
        <label>Nota
          <select name="nota">
            <option>5</option><option>4</option><option>3</option><option>2</option><option>1</option>
          </select>
        </label>
        <label>Comentário
          <textarea name="texto" rows="3" required></textarea>
        </label>
        <button class="btn">Enviar avaliação</button>
      </form>
    </section>
  </main>

  <script src="js/comum.js"></script>
  <script src="js/produto.js"></script>
</body>
</html>
