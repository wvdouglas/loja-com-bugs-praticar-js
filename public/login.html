<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechLoja — Entrar</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header id="cabecalho"></header>

  <main class="duas-colunas">
    <form id="form-login" class="form">
      <h2>Já sou cliente</h2>
      <label>E-mail <input name="email" type="text" autocomplete="username" required></label>
      <label>Senha <input name="senha" type="password" autocomplete="current-password" required></label>
      <button class="btn">Entrar</button>
      <p id="msg-login" class="erro"></p>
    </form>

    <form id="form-cadastro" class="form">
      <h2>Criar conta</h2>
      <label>Nome <input name="nome" type="text"></label>
      <label>E-mail <input name="email" type="text"></label>
      <label>Senha <input name="senha" type="password"></label>
      <button class="btn">Cadastrar</button>
      <p id="msg-cadastro" class="erro"></p>
    </form>
  </main>

  <script src="js/comum.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
